<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="AutoCare — Gestión simple para talleres mecánicos: órdenes de trabajo, clientes, vehículos y repuestos. 100% local, sin backend.">
<meta name="theme-color" content="#f2ece1">
<title>AutoCare · Gestión de taller mecánico</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23b5461f'/%3E%3Cpath d='M16 38l4-11a4 4 0 013.8-2.7h16.4A4 4 0 0144 27l4 11M16 38h32M16 38v7m32-7v7' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='23' cy='38' r='3' fill='white'/%3E%3Ccircle cx='41' cy='38' r='3' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/app.css">
<script>
  /* Tema aplicado antes del primer pintado para evitar destellos */
  (function () {
    try {
      var t = localStorage.getItem('autocare.theme') || 'system';
      var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme-pref', t);
    } catch (e) { /* sin localStorage: modo claro */ }
  })();
</script>
</head>
<body>
<a class="skip-link" id="skipLink" href="#viewRoot">Saltar al contenido</a>

<div class="app">
  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M5 17l1.6-5.2A2 2 0 018.5 10h7a2 2 0 011.9 1.8L19 17M5 17v2.5M19 17v2.5"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg>
      </span>
      <span class="brand-text">
        <strong>Auto<span>Care</span></strong>
        <small>Gestión de taller</small>
      </span>
      <button class="icon-btn sidebar-close only-mobile" data-action="close-sidebar" aria-label="Cerrar menú">
        <svg class="icon"><use href="#i-x"></use></svg>
      </button>
    </div>

    <nav class="nav" id="nav">
      <p class="nav-label">Principal</p>
      <a class="nav-item" href="#/dashboard" data-route="dashboard"><svg class="icon"><use href="#i-dashboard"></use></svg><span>Dashboard</span></a>
      <a class="nav-item" href="#/ordenes" data-route="ordenes"><svg class="icon"><use href="#i-wrench"></use></svg><span>Órdenes de trabajo</span><span class="nav-count" id="navOrdenesCount" hidden></span></a>

      <p class="nav-label">Gestión</p>
      <a class="nav-item" href="#/clientes" data-route="clientes"><svg class="icon"><use href="#i-users"></use></svg><span>Clientes</span></a>
      <a class="nav-item" href="#/vehiculos" data-route="vehiculos"><svg class="icon"><use href="#i-car"></use></svg><span>Vehículos</span></a>
      <a class="nav-item" href="#/repuestos" data-route="repuestos"><svg class="icon"><use href="#i-box"></use></svg><span>Repuestos</span><span class="nav-dot" id="navStockDot" hidden title="Stock crítico"></span></a>
    </nav>

    <div class="sidebar-foot">
      <div class="storage-card">
        <svg class="icon" aria-hidden="true"><use href="#i-database"></use></svg>
        <div>
          <strong>Datos locales</strong>
          <small id="storageInfo">—</small>
        </div>
      </div>
      <p class="version">AutoCare v2.0 · <span id="yearNow"></span></p>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop" data-action="close-sidebar" hidden></div>

  <!-- ===================== CONTENIDO ===================== -->
  <div class="main-wrap">
    <header class="topbar">
      <button class="icon-btn only-mobile" data-action="open-sidebar" aria-label="Abrir menú">
        <svg class="icon"><use href="#i-menu"></use></svg>
      </button>

      <div class="page-heading">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub">Resumen general del taller</p>
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" id="themeBtn" data-action="toggle-theme" aria-label="Cambiar tema" title="Cambiar tema">
          <svg class="icon theme-icon-light"><use href="#i-moon"></use></svg>
          <svg class="icon theme-icon-dark"><use href="#i-sun"></use></svg>
        </button>

        <button class="btn btn-primary topbar-cta" data-action="new-order">
          <svg class="icon"><use href="#i-plus"></use></svg>
          <span>Nueva orden</span>
        </button>
      </div>
    </header>

    <main class="content" id="viewRoot" tabindex="-1"></main>
  </div>
</div>

<!-- ===================== MODAL GENÉRICO ===================== -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-head">
      <h2 id="modalTitle">Título</h2>
      <button class="icon-btn" data-action="close-modal" aria-label="Cerrar">
        <svg class="icon"><use href="#i-x"></use></svg>
      </button>
    </header>
    <div class="modal-body" id="modalBody"></div>
    <footer class="modal-foot" id="modalFoot" hidden></footer>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<!-- Contenedor exclusivo para impresión de documentos -->
<div id="printArea" aria-hidden="true"></div>
